# --- Our service -------------------------------------------------------------
# WireMock already uses 8080. Port 5000 (used in the assignment examples) is taken on macOS by the
# AirPlay Receiver, so the service listens on 8081.
quarkus.http.port=8081
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=20M

# --- Provided dependencies (WireMock) ----------------------------------------
downstream.base-url=http://localhost:8080
quarkus.rest-client.product-context.url=${downstream.base-url}
quarkus.rest-client.availability-api.url=${downstream.base-url}
quarkus.rest-client.event-sink.url=${downstream.base-url}
quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout=5000
# The snapshot (~35 MB) needs more time than a single lookup.
quarkus.rest-client.product-context.read-timeout=60000
# Non-2xx responses are classified by HttpResponses instead of being thrown by the client.
microprofile.rest.client.disable.default.mapper=true

# --- Retries (transient failures only: 429, 5xx, IO errors) -------------------
retry.max-attempts=3
retry.initial-backoff=200ms
# Longest single wait we accept in-process. A Retry-After above this is not waited for:
# the failure is handed back to the caller (broker redelivery / job row error).
retry.max-backoff=5s

# --- Bulk imports (flow control) ---------------------------------------------
# Import jobs running at the same time.
bulk.max-concurrent-jobs=2
# Rows processed in parallel across ALL jobs = max in-flight calls per downstream from bulk work.
bulk.row-concurrency=8

# --- API documentation --------------------------------------------------------
# Swagger UI at http://localhost:8081/q/swagger-ui, OpenAPI spec at http://localhost:8081/q/openapi
# (by default Quarkus only exposes the UI in dev mode; this keeps it available in the packaged jar too)
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Size-Level Availability Processor
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Single-event and bulk CSV availability processing

# --- Logging ------------------------------------------------------------------
quarkus.log.category."com.example.availability".level=INFO

# --- Test profile -----------------------------------------------------------------
# Short backoffs keep tests fast; Retry-After: 5 (WireMock faults) exceeds max-backoff,
# so those faults are not retried in tests.
%test.retry.initial-backoff=1ms
%test.retry.max-backoff=50ms
